<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Name - Academic Profile</title>
    <style>
        :root {
            --primary-color: #666;
            --secondary-color: #808080;
            --accent-color: #3498db;
            --text-color: #333;
        }
        
        body {
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 0;
            color: var(--text-color);
        }

        nav {
            background-color: var(--primary-color);
            padding: 1rem;
            position: sticky;
            top: 0;
        }

        nav ul {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            justify-content: center;
            gap: 2rem;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
        }

        nav a:hover {
            color: var(--accent-color);
        }

        .hero {
            position: relative;
            height: 400px;
            overflow: hidden;
        }

        .hero img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .hero h1 {
            position: absolute;
            bottom: -1.5rem;
            left: 2rem;
            color: white;
            font-size: 3rem;
            font-weight: 300;
            text-shadow: none;
            margin: 0;
            background: transparent;
            padding: 0;
            letter-spacing: -0.02em;
        }

        main {
            max-width: 800px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .title {
            color: var(--primary-color);
            margin-bottom: 0.5rem;
        }

        .affiliations {
            margin-bottom: 2rem;
        }

        .address {
            color: var(--secondary-color);
            font-style: italic;
        }

        @media (max-width: 768px) {
            nav ul {
                flex-direction: column;
                align-items: center;
                gap: 1rem;
            }

            .hero {
                height: 300px;
            }

            .hero h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <nav>
        <ul>
            <li><a href="#home">Home</a></li>
            <li><a href="#work">Work in Progress</a></li>
            <li><a href="#publications">Publications</a></li>
            <li><a href="#cv">CV</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </nav>

    <div class="hero">
        <img src="/api/placeholder/1200/400" alt="Hero Image">
        <h1>Citlali Trigos-Raczkowski</h1>
    </div>

    <main>
        <div class="affiliations">
            <h2 class="title">Research Fellow</h2>
            <p>Institut national d'études démographiques (INED)</p>
            <p class="address">
                Campus Condorcet<br>
                9 cours des Humanités<br>
                93322 Aubervilliers cedex<br>
                France
            </p>
        </div>

        <!-- Add more sections as needed -->
    </main>
</body>
</html>
