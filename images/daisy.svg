<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <!-- Petals -->
    <g transform="translate(50 50)">
        <ellipse cx="0" cy="-25" rx="12" ry="20" fill="#FFB6C1" transform="rotate(0)"/>
        <ellipse cx="0" cy="-25" rx="12" ry="20" fill="#FFB6C1" transform="rotate(45)"/>
        <ellipse cx="0" cy="-25" rx="12" ry="20" fill="#FFB6C1" transform="rotate(90)"/>
        <ellipse cx="0" cy="-25" rx="12" ry="20" fill="#FFB6C1" transform="rotate(135)"/>
        <ellipse cx="0" cy="-25" rx="12" ry="20" fill="#FFB6C1" transform="rotate(180)"/>
        <ellipse cx="0" cy="-25" rx="12" ry="20" fill="#FFB6C1" transform="rotate(225)"/>
        <ellipse cx="0" cy="-25" rx="12" ry="20" fill="#FFB6C1" transform="rotate(270)"/>
        <ellipse cx="0" cy="-25" rx="12" ry="20" fill="#FFB6C1" transform="rotate(315)"/>
    </g>
    <!-- Center circle -->
    <circle cx="50" cy="50" r="15" fill="#FFA500"/>
</svg>