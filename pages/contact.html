<div style="max-width: 800px; width: 100%; margin-top: 1.5rem;">
    <h2 style="color: #666; font-weight: 400; margin-top: 0; margin-bottom: 1rem;">Contact Me</h2>
    <p style="color: #666; line-height: 1.7; margin-bottom: 2rem;">
        Feel free to reach out via <span style="display: inline-flex; align-items: center; cursor: pointer;" onclick="copyEmailContact()">citrigos@berkeley.edu<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="2" style="margin-left: 6px; opacity: 0.6;"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg></span> or use the form below.
    </p>

    <form id="contact-form" action="https://formspree.io/f/xqepljde" method="POST" style="display: flex; flex-direction: column; gap: 1.2rem; max-width: 600px;">
        <div>
            <label for="name" style="display: block; margin-bottom: 0.4rem; color: #666; font-weight: 300;">Name</label>
            <input type="text" id="name" name="name" required style="width: 100%; padding: 0.6rem; border: 1px solid #e0e0e0; font-family: inherit; font-size: 1rem; font-weight: 300; box-sizing: border-box;">
        </div>

        <div>
            <label for="email" style="display: block; margin-bottom: 0.4rem; color: #666; font-weight: 300;">Email</label>
            <input type="email" id="email" name="email" required style="width: 100%; padding: 0.6rem; border: 1px solid #e0e0e0; font-family: inherit; font-size: 1rem; font-weight: 300; box-sizing: border-box;">
        </div>

        <div>
            <label for="message" style="display: block; margin-bottom: 0.4rem; color: #666; font-weight: 300;">Message</label>
            <textarea id="message" name="message" rows="6" required style="width: 100%; padding: 0.6rem; border: 1px solid #e0e0e0; font-family: inherit; font-size: 1rem; font-weight: 300; resize: vertical; box-sizing: border-box;"></textarea>
        </div>

        <div style="display: flex; align-items: center; gap: 1rem;">
            <button type="submit" style="padding: 0.6rem 1.5rem; background: #666; color: white; border: none; font-size: 1rem; cursor: pointer; transition: background 0.2s ease; font-weight: 300;">Send</button>
            <span id="form-status" style="color: #4a7c8c; font-weight: 400; display: none;">Message sent successfully! ✓</span>
        </div>
    </form>
</div>
